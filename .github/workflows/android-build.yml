
name: Build Campus Library APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name=campus_library \
            --org=com.campuslibrary \
            build_app

      - name: Copy application files
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          cp -r lib build_app/lib

      - name: Get dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-Library-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          
